# 手机端产物:① lookatstudy-mobile.zip(Termux 便携包:server.cjs + web 前端,零 npm install)
#            ② LookatStudy-launcher.apk(引导器:装 Termux + 一键引导 + Custom Tab 打开)
# 触发与挂包约定同 package.yml:推 v* 标签自动,或 dispatch 带 release_tag 挂到既有 Release。
name: Android

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Also attach mobile assets to this existing release tag (e.g. v0.9.0). Empty = only upload workflow artifacts."
        required: false
        default: ""
  push:
    tags: ["v*"]

# attach-to-release 用 GITHUB_TOKEN 调 gh release upload,需要 release(=contents)写权限。
permissions:
  contents: write
  id-token: write # npm trusted publishing(OIDC)

jobs:
  mobile-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build mobile bundle (vite renderer + esbuild server.cjs)
        run: npm run build:mobile

      - name: Zip portable package
        run: cd dist/mobile && zip -r ../../lookatstudy-mobile.zip .

      # npm 分发(npmmirror 同步,Termux 安装器主源)。
      # trusted publishing(OIDC):零 token——npmjs.com 上配 pending publisher
      # (repo=Kaiji-Z/LookatStudy, workflow=android-build.yml)。npm ≥11.5.1 先升级。
      - name: Publish mobile bundle to npm (trusted publishing)
        env:
          PKG_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          npm install -g npm@latest >/dev/null
          npm --version
          PKG_V="${PKG_VERSION#v}" node -e "const fs=require('fs');fs.writeFileSync('dist/mobile/package.json',JSON.stringify({name:'lookatstudy-mobile',version:process.env.PKG_V,description:'LookatStudy Termux portable bundle (server.cjs + web frontend)',repository:{type:'git',url:'git+https://github.com/Kaiji-Z/LookatStudy.git'}},null,2))"
          cat dist/mobile/package.json
          cd dist/mobile && npm publish --access public

      # 引导器的一行安装命令 curl 它执行(独立资产,免解压 zip)
      - name: Stage standalone installer
        run: cp dist/mobile/install-termux.sh ./install-termux.sh

      - name: Upload mobile zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: lookatstudy-mobile-zip
          path: |
            lookatstudy-mobile.zip
            install-termux.sh
          if-no-files-found: error
          retention-days: 14

  launcher-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fetch Termux APK into res/raw (not committed; GPL work, source linked)
        run: bash android/fetch-termux.sh

      - uses: gradle/actions/setup-gradle@v3

      - name: Build launcher APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk LookatStudy-launcher.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LookatStudy-launcher-apk
          path: LookatStudy-launcher.apk
          if-no-files-found: error
          retention-days: 14

  attach-to-release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: [mobile-zip, launcher-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download mobile artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Attach mobile assets to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.release_tag || github.ref_name }}" assets/lookatstudy-mobile-zip/lookatstudy-mobile.zip assets/lookatstudy-mobile-zip/install-termux.sh assets/LookatStudy-launcher-apk/LookatStudy-launcher.apk --repo "$GITHUB_REPOSITORY" --clobber
