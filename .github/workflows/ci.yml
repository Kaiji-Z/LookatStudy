name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck renderer
        run: npx tsc --noEmit

      - name: Typecheck main + preload
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: Logic test suites (63 suites)
        run: npm run verify:core

      - name: Build renderer
        run: npm run build
