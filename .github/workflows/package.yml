# 多平台打包:手动触发(workflow_dispatch,可在任意分支试跑)或推 v* 标签自动触发。
# 产物先传 workflow artifacts;若是标签构建,末尾的 attach 任务把安装包挂到对应 GitHub Release。
name: Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Also attach installers to this existing release tag (e.g. v0.9.0). Empty = only upload workflow artifacts."
        required: false
        default: ""
  push:
    tags: ["v*"]

# attach-to-release 用 GITHUB_TOKEN 调 gh release upload,需要 release(=contents)写权限。
# 仓库默认 token 只读,不声明这行会 403 Resource not accessible by integration。
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-installer
          - os: macos-latest
            artifact: macos-installer
          - os: ubuntu-latest
            artifact: linux-installer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build renderer + package (electron-builder, current OS target)
        # --publish never: electron-builder 在 GH Actions 检测到 CI 会默认自动 publish(找 GH_TOKEN),
        # 上传交给本文件末尾的 attach-to-release 任务用 gh 控制。
        run: npm run build && npx electron-builder --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14

  attach-to-release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Attach installers to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          # 三个 tag 工作流并发跑,谁先到谁建壳(此前全靠本地手工 create,漏了就 attach 失败)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "LookatStudy $TAG" --notes ""
          gh release upload "$TAG" installers/*/* --repo "$GITHUB_REPOSITORY" --clobber
