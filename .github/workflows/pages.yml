name: pages

# Landing page (site/) → GitHub Pages at https://kaiji-z.github.io/LookatStudy/
# Screenshots stay in docs/screenshots/ and are staged into the artifact here,
# so the page's relative paths (docs/screenshots/...) work identically in CI.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/screenshots/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage deploy directory
        run: |
          mkdir -p deploy/docs
          cp -r site/. deploy/
          cp -r docs/screenshots deploy/docs/screenshots

      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - id: deployment
        uses: actions/deploy-pages@v4
