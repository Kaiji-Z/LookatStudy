name: Termux Voice

# 路 3:CI 交叉编译 Termux(bionic arm64)语音引擎包,挂到 Release。
# 产物 sherpa-onnx-node-android-arm64-*.tar.gz(~12MB):
#   上游 C-API NAPI 绑定(NDK 编译)+ k2-fsa 官方 android 预编译双 .so + npm JS 包装层。
# 用户侧零编译:install-termux.sh 下载解压即用(构建细节见 scripts/build-termux-voice.mjs 头注)。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "挂载到哪个 Release(如 v0.12.1)"
        required: false

permissions:
  contents: write
  id-token: write # npm trusted publishing(OIDC)需要;provenance 同吃这个

jobs:
  build-and-attach:
    name: Build termux voice engine
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install toolchain (cmake/ninja/NDK r28c)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build unzip patchelf
          cmake --version
          ninja --version
          # sdkmanager 拉 NDK 在 runner 上实测 >30min 超时;Google CDN 直连 zip 秒级
          curl -fL --retry 2 -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -q /tmp/ndk.zip -d /tmp/ndkout
          mkdir -p /usr/local/lib/android/sdk/ndk
          mv /tmp/ndkout/android-ndk-r28c /usr/local/lib/android/sdk/ndk/28.2.13676358
          test -f /usr/local/lib/android/sdk/ndk/28.2.13676358/build/cmake/android.toolchain.cmake

      - name: npm deps (tar-stream for the build script + JS wrapper layer)
        run: npm install --no-audit --no-fund

      - name: Resolve release tag early
        id: rel0
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build engine package
        run: node scripts/build-termux-voice.mjs
        env:
          GITHUB_ACTIONS: "1"
          ANDROID_NDK: /usr/local/lib/android/sdk/ndk/28.2.13676358
          CMAKE_BIN: cmake
          NINJA_BIN: ninja
          RELEASE_TAG: ${{ steps.rel0.outputs.tag }}

      - name: Resolve release tag
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.rel.outputs.tag }}"
          gh release upload "$TAG" .termux-build/lookatstudy-termux-voice.tar.gz --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'

      # npm 分发(npmmirror 自动同步,Termux 安装器主源)。
      # trusted publishing(OIDC):零 token——npmjs.com 上为包名配置 pending publisher
      # (repo=Kaiji-Z/LookatStudy, workflow=termux-voice.yml)后,首Publish即认领。
      # npm CLI ≥11.5.1 才认 OIDC(Node 22 自带 npm 10),先升级。
      - name: Publish engine package to npm (trusted publishing)
        run: |
          npm install -g npm@latest >/dev/null
          npm --version
          cd .termux-build/stage/sherpa-onnx-node
          npm publish --access public
